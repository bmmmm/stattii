name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # stdlib only, so this is really a check of the Go toolchain's
      # own advisories against the symbols we actually call. Pinned:
      # @latest would run unreviewed code on every PR and break CI the
      # day x/vuln's go directive outruns go.mod.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # -race matters here: scheduler, Telegram poller and two HTTP
      # servers share one mutex-guarded Service.
      - run: go test -race ./...
      - run: go build .
